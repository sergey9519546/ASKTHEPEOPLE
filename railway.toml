[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "/backend/**",
  "/frontend/**",
  "/Dockerfile",
  "/.dockerignore",
  "/LICENSE",
  "/railway.toml",
]

[deploy]
# No startCommand — the Dockerfile CMD ["sh", "-c", "exec gunicorn..."] handles
# the web process. Railway passes startCommand as a raw single arg to gosu,
# which cannot exec shell builtins like 'cd'. Let Docker handle it instead.
healthcheckPath = "/health"
healthcheckTimeout = 300
drainingSeconds = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

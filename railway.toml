[build]
builder = "DOCKERFILE"
# dockerfilePath is NOT hardcoded here so that each service can set
# RAILWAY_DOCKERFILE_PATH in its own environment variables.
# Web service: uses default Dockerfile discovery (finds Dockerfile).
# Worker service: sets RAILWAY_DOCKERFILE_PATH=Dockerfile.worker.
watchPatterns = [
  "backend/**",
  "frontend/**",
  "Dockerfile",
  "Dockerfile.worker",
  ".dockerignore",
  "LICENSE",
  "railway.toml",
]

[deploy]
# RELEASE NO-GO: this config describes a single service while current graph
# and report workers require same-host filesystem state. Railway can autodeploy
# directly from GitHub independently of the repository Actions gate, so every
# new deployment is blocked in the image until canonical shared persistence and
# revision-atomic web/worker/beat deployment are implemented and reviewed.
preDeployCommand = ["python /app/backend/scripts/block_legacy_railway_deploy.py"]
# healthcheckPath applies to both web and worker services.
# Worker runs worker_health.py which responds 200 at /health.
# Web runs Flask which responds at /health.
healthcheckPath = "/health"
healthcheckTimeout = 300
drainingSeconds = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

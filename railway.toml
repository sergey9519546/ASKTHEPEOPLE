[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "/backend/**",
  "/frontend/**",
  "/Dockerfile",
  "/.dockerignore",
  "/LICENSE",
  "/railway.toml",
]

[deploy]
# Web process: gunicorn serving the Flask app
startCommand = "cd /app/backend && exec gunicorn --bind 0.0.0.0:${PORT:-5001} --workers 1 --threads 4 --timeout 300 --graceful-timeout 240 --access-logfile - --access-logformat '%(h)s %(l)s %(u)s %(t)s \"%(r)s\" %(s)s %(b)s \"%(f)s\" \"%(a)s\" %(D)s' wsgi:app"
healthcheckPath = "/health"
healthcheckTimeout = 300
drainingSeconds = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

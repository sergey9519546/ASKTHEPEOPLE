[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "/backend/**",
  "/frontend/**",
  "/Dockerfile",
  "/.dockerignore",
  "/LICENSE",
  "/railway.toml",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
drainingSeconds = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

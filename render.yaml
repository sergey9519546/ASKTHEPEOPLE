services:
  - type: web
    name: askthepeople
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: LLM_MODEL_NAME
        value: qwen-plus
      - key: ZEP_API_KEY
        sync: false
      - key: PORT
        value: 5001
    healthCheckPath: /

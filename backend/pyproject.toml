[project]
name = "askthepeople-backend"
version = "0.1.0"
description = "ASKTHEPEOPLE - Crowd Intelligence Simulation Engine"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "ASKTHEPEOPLE Team" }
]

dependencies = [
    # Core Framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "flask-limiter>=3.5.0",
    "flask-sock>=0.7.0",
    # LLM-Related
    "openai>=1.0.0",
    # Zep Cloud
    "zep-cloud==3.13.0",
    # OASIS Social Media Simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    # File Processing
    "PyMuPDF>=1.24.0",
    "fpdf2>=2.7.9",
    # Encoding detection (supports non-UTF-8 text files)
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    # Data export (CSV/PDF generation)
    "pandas>=1.5.0",
    # Graph analysis (validation metrics)
    "networkx>=3.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "gunicorn>=25.1.0",
]

# CPU-only torch index — forces uv to download ~100MB CPU wheels instead of
# ~526MB GPU wheels (nvidia-cublas, cudnn, etc.) during Docker builds.
# OASIS uses API-based LLMs, never local GPU inference.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# Override transitive GPU dependencies to nothing (CPU torch has no CUDA deps).
# camel-ai/sentence-transformers pull torch transitively, but with these
# overrides we skip nvidia-cublas-cu12, nvidia-cudnn-cu12, triton, etc.
[tool.uv]
# Block ALL CUDA / GPU packages via env marker trick.
# `sys_platform == 'never'` makes these never resolve on any real platform.
# This works because uv honors env markers in overrides during resolution.
override-dependencies = [
    "nvidia-cublas-cu12; sys_platform == 'never'",
    "nvidia-cuda-cupti-cu12; sys_platform == 'never'",
    "nvidia-cuda-nvrtc-cu12; sys_platform == 'never'",
    "nvidia-cuda-runtime-cu12; sys_platform == 'never'",
    "nvidia-cudnn-cu12; sys_platform == 'never'",
    "nvidia-cufft-cu12; sys_platform == 'never'",
    "nvidia-curand-cu12; sys_platform == 'never'",
    "nvidia-cusolver-cu12; sys_platform == 'never'",
    "nvidia-cusparse-cu12; sys_platform == 'never'",
    "nvidia-nccl-cu12; sys_platform == 'never'",
    "nvidia-nvjitlink-cu12; sys_platform == 'never'",
    "nvidia-nvtx-cu12; sys_platform == 'never'",
    # cu13 variants (torch 2.13):
    "nvidia-cublas; sys_platform == 'never'",
    "nvidia-cuda-cccl; sys_platform == 'never'",
    "nvidia-cuda-cupti; sys_platform == 'never'",
    "nvidia-cuda-nvrtc; sys_platform == 'never'",
    "nvidia-cuda-runtime; sys_platform == 'never'",
    "nvidia-cudnn-cu13; sys_platform == 'never'",
    "nvidia-cufft; sys_platform == 'never'",
    "nvidia-curand; sys_platform == 'never'",
    "nvidia-cusolver; sys_platform == 'never'",
    "nvidia-cusparse; sys_platform == 'never'",
    "nvidia-cufile; sys_platform == 'never'",
    "nvidia-cusparselt-cu13; sys_platform == 'never'",
    "nvidia-nccl-cu13; sys_platform == 'never'",
    "nvidia-nvjitlink; sys_platform == 'never'",
    "nvidia-nvshmem-cu13; sys_platform == 'never'",
    "nvidia-nvtx; sys_platform == 'never'",
    "triton; sys_platform == 'never'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::SyntaxWarning",
]
setenv = [
    "PYTHONPATH=",
]


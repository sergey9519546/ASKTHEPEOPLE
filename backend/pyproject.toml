[project]
name = "askthepeople-backend"
version = "0.1.0"
description = "ASKTHEPEOPLE - Crowd Intelligence Simulation Engine"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "ASKTHEPEOPLE Team" }
]

dependencies = [
    # Core Framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "flask-limiter>=3.5.0",
    "flask-sock>=0.7.0",
    # Background Tasks & Caching
    "celery>=5.3.0",
    "redis>=5.0.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.2.0",  # PostgreSQL driver for SQLAlchemy 2 sync
    # Supabase — Storage + Auth client (Postgres goes through SQLAlchemy/psycopg)
    "supabase>=2.6.0",
    "gotrue>=2.6.0",  # transitive but pinned for safety; supabase-py re-exports
    # S3-compatible client (used against MinIO in local dev; supabase-py
    # Storage path is used in cloud). Not required in production where
    # supabase-py talks to the Supabase Storage HTTP API.
    "minio>=7.2.0",
    # LLM-Related
    "openai>=1.0.0",
    # Zep Cloud
    "zep-cloud==3.27.0",
    # OASIS Social Media Simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",  # pinned: camel-oasis==0.2.5 requires exactly this version
    # OASIS imports torch directly from its recommendation engine; CPU build explicit
    "torch==2.13.0",
    # OASIS imports SentenceTransformer at module load
    "sentence-transformers==5.7.0",
    # Security advisory override
    "transformers==5.15.0",
    # MCP server compatibility pin
    "mcp>=1.3.0,<2",
    # File Processing
    "PyMuPDF>=1.24.0",
    "fpdf2>=2.7.9",
    # Encoding detection
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    # Data export & Graph analysis
    "pandas>=1.5.0",
    "networkx>=3.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "gunicorn>=25.1.0",
    "sentry-sdk[flask]>=1.40.0",
]

# CPU-only torch index routing
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
override-dependencies = [
    "sentence-transformers==5.7.0",
    "unstructured; sys_platform == 'never'",
    "pillow>=12.3.0",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-env>=1.1.0,<2",
]
exclude-dependencies = [
    "nvidia-cublas-cu12",
    "nvidia-cuda-cupti-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-cusolver-cu12",
    "nvidia-cusparse-cu12",
    "nvidia-nccl-cu12",
    "nvidia-nvjitlink-cu12",
    "nvidia-nvtx-cu12",
    "nvidia-cublas",
    "nvidia-cuda-cccl",
    "nvidia-cuda-cupti",
    "nvidia-cuda-nvrtc",
    "nvidia-cuda-runtime",
    "nvidia-cudnn-cu13",
    "nvidia-cufft",
    "nvidia-curand",
    "nvidia-cusolver",
    "nvidia-cusparse",
    "nvidia-cufile",
    "nvidia-cusparselt-cu13",
    "nvidia-nccl-cu13",
    "nvidia-nvjitlink",
    "nvidia-nvshmem-cu13",
    "nvidia-nvtx",
    "triton",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-env>=1.1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --tb=short --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::SyntaxWarning",
]
env = [
    "PYTHONPATH=",
    "FLASK_DEBUG=true",
]

[project]
name = "askthepeople-backend"
version = "0.1.0"
description = "ASKTHEPEOPLE - Crowd Intelligence Simulation Engine"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "ASKTHEPEOPLE Team" }
]

dependencies = [
    # Core Framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "flask-limiter>=3.5.0",
    "flask-sock>=0.7.0",
    # LLM-Related
    "openai>=1.0.0",
    # Zep Cloud
    "zep-cloud==3.13.0",
    # OASIS Social Media Simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    # File Processing
    "PyMuPDF>=1.24.0",
    "fpdf2>=2.7.9",
    # Encoding detection (supports non-UTF-8 text files)
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    # Data export (CSV/PDF generation)
    "pandas>=1.5.0",
    # Graph analysis (validation metrics)
    "networkx>=3.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "gunicorn>=25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::SyntaxWarning",
]
setenv = [
    "PYTHONPATH=",
]


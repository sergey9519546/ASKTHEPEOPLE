name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  actions: read # Called production job verifies environment protection via API.
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede stale pull-request feedback, but never interrupt a main run after
  # its tested revision may already have started the production deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.15"

      - name: Export the complete pinned Python dependency closure
        run: |
          uv export --frozen --all-groups --all-extras --no-hashes \
            --no-emit-project \
            --output-file "${RUNNER_TEMP}/backend-audit.txt" >/dev/null
          test -s "${RUNNER_TEMP}/backend-audit.txt"
          test "$(grep -cE '^[A-Za-z0-9_.-]+==' "${RUNNER_TEMP}/backend-audit.txt")" -ge 100

          # PyTorch's CPU index uses a local-version suffix that vulnerability
          # databases do not recognize. Map it to the equivalent public base
          # version for advisory lookup; never omit the package from the gate.
          sed -i -E 's/^(torch==[0-9.]+)\+cpu/\1/' \
            "${RUNNER_TEMP}/backend-audit.txt"
          test "$(grep -c '^torch==' "${RUNNER_TEMP}/backend-audit.txt")" -ge 1
          ! grep -qE '^torch==[^[:space:]]*\+cpu' \
            "${RUNNER_TEMP}/backend-audit.txt"

      - name: Audit pinned Python project dependencies (pip-audit)
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          --vulnerability-service osv
          --no-deps --disable-pip --strict --desc
          --requirement "${RUNNER_TEMP}/backend-audit.txt"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        env:
          FLASK_DEBUG: "true"
          SECRET_KEY: "ci-secret-key-for-testing-only"
          LLM_API_KEY: "ci-test-key"
          ZEP_API_KEY: "ci-test-key"
        run: uv run --frozen pytest -q --ignore=tests/evals

      - name: Run evaluation suite
        env:
          FLASK_DEBUG: "true"
          SECRET_KEY: "ci-secret-key-for-testing-only"
          LLM_API_KEY: "ci-test-key"
          ZEP_API_KEY: "ci-test-key"
        run: uv run --frozen pytest tests/evals/ -v --tb=short

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Audit root lock before executing dependencies
        working-directory: .
        run: npm audit --package-lock-only --audit-level=high

      - name: Audit frontend lock before executing dependencies
        run: npm audit --package-lock-only --audit-level=high

      - name: Install root development tooling
        working-directory: .
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit root development tooling
        working-directory: .
        run: npm audit --audit-level=high

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit all frontend dependencies (npm audit)
        run: npm audit --audit-level=high

  container-smoke:
    name: Container build and runtime boundary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the exact candidate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=ci-container
          cache-to: type=gha,mode=max,scope=ci-container
          context: .
          load: true
          provenance: false
          push: false
          tags: askthepeople-ci:${{ github.sha }}

      - name: Build the exact worker candidate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=ci-worker-container
          cache-to: type=gha,mode=max,scope=ci-worker-container
          context: .
          file: Dockerfile.worker
          load: true
          provenance: false
          push: false
          tags: askthepeople-worker-ci:${{ github.sha }}

      - name: Start candidate and verify health and access boundary
        env:
          IMAGE_TAG: askthepeople-ci:${{ github.sha }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runtime_env="${RUNNER_TEMP}/container-smoke.env"
          container_id=""
          cleanup() {
            if [ -n "$container_id" ]; then
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
            rm --force "$runtime_env"
          }
          trap cleanup EXIT

          {
            printf 'SECRET_KEY=%s\n' "$(openssl rand -hex 32)"
            printf 'REQUIRE_APP_AUTH=true\n'
            printf 'APP_TOKEN=%s\n' "$(openssl rand -hex 32)"
            printf 'FLASK_DEBUG=false\n'
            printf 'CORS_ORIGINS=http://127.0.0.1:5001\n'
            printf 'TRUSTED_HOSTS=127.0.0.1,localhost\n'
            printf 'LLM_API_KEY=build-validation-model-key\n'
            printf 'ZEP_API_KEY=build-validation-zep-key\n'
          } > "$runtime_env"
          chmod 0600 "$runtime_env"

          container_id="$(
            docker run \
              --detach \
              --env-file "$runtime_env" \
              --publish 127.0.0.1:5001:5001 \
              "$IMAGE_TAG"
          )"

          health=""
          for attempt in $(seq 1 90); do
            health="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --max-time 5 \
                http://127.0.0.1:5001/health || true
            )"
            if printf '%s' "$health" |
              jq -e \
                --arg revision "$TESTED_SHA" \
                '.status == "ok" and .revision == $revision' >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              docker logs --tail 200 "$container_id" >&2
              echo "::error::Candidate container never reported the tested revision."
              exit 1
            fi
            sleep 2
          done

          unauthenticated_status="$(
            curl \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              http://127.0.0.1:5001/api/settings
          )"
          test "$unauthenticated_status" = "401"

          app_token="$(sed -n 's/^APP_TOKEN=//p' "$runtime_env")"
          authenticated="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              --header "Authorization: Bearer ${app_token}" \
              http://127.0.0.1:5001/api/settings
          )"
          printf '%s' "$authenticated" |
            jq -e '.success == true' >/dev/null

      - name: Verify worker availability and beat command boundary
        env:
          TESTED_SHA: ${{ github.sha }}
          WORKER_IMAGE_TAG: askthepeople-worker-ci:${{ github.sha }}
        run: |
          set -euo pipefail
          network_name="askthepeople-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          redis_name="askthepeople-redis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          worker_name="askthepeople-worker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          runtime_env="${RUNNER_TEMP}/worker-smoke.env"
          cleanup() {
            docker rm --force "$worker_name" >/dev/null 2>&1 || true
            docker rm --force "$redis_name" >/dev/null 2>&1 || true
            docker network rm "$network_name" >/dev/null 2>&1 || true
            rm --force "$runtime_env"
          }
          trap cleanup EXIT

          docker network create "$network_name" >/dev/null
          docker run \
            --detach \
            --name "$redis_name" \
            --network "$network_name" \
            redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952 >/dev/null

          for attempt in $(seq 1 30); do
            if docker exec "$redis_name" redis-cli ping 2>/dev/null |
              grep -qx PONG; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs --tail 100 "$redis_name" >&2
              echo "::error::Worker smoke Redis dependency did not become ready."
              exit 1
            fi
            sleep 1
          done

          {
            printf 'SECRET_KEY=%s\n' "$(openssl rand -hex 32)"
            printf 'REQUIRE_APP_AUTH=true\n'
            printf 'APP_TOKEN=%s\n' "$(openssl rand -hex 32)"
            printf 'FLASK_DEBUG=false\n'
            printf 'LLM_API_KEY=worker-smoke-model-key\n'
            printf 'ZEP_API_KEY=worker-smoke-zep-key\n'
            printf 'REDIS_URL=redis://%s:6379/0\n' "$redis_name"
            printf 'CELERY_BROKER_URL=redis://%s:6379/0\n' "$redis_name"
            printf 'CELERY_RESULT_BACKEND=redis://%s:6379/0\n' "$redis_name"
            printf 'PORT=8080\n'
          } > "$runtime_env"
          chmod 0600 "$runtime_env"

          docker run \
            --detach \
            --env-file "$runtime_env" \
            --name "$worker_name" \
            --network "$network_name" \
            --publish 127.0.0.1:18080:8080 \
            "$WORKER_IMAGE_TAG" >/dev/null

          for attempt in $(seq 1 90); do
            worker_health="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --max-time 3 \
                http://127.0.0.1:18080/health || true
            )"
            if printf '%s' "$worker_health" |
              jq -e \
                --arg revision "$TESTED_SHA" \
                '. == {status:"ok", service:"celery-worker", revision:$revision}' \
                >/dev/null; then
              test "$(
                docker inspect \
                  --format '{{.State.Health.Status}}' \
                  "$worker_name"
              )" = "healthy"
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              docker logs --tail 200 "$worker_name" >&2
              echo "::error::Worker never attested the tested image revision."
              exit 1
            fi
            sleep 2
          done

          docker run \
            --rm \
            --entrypoint /bin/sh \
            --env-file "$runtime_env" \
            --network "$network_name" \
            "$WORKER_IMAGE_TAG" \
            -c 'cd /app/backend && celery -A app.celery_app beat --help >/dev/null'

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks CLI
        env:
          GITLEAKS_ARCHIVE_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --max-time 120 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" |
            sha256sum --check --strict
          tar \
            --extract \
            --gzip \
            --file "$archive" \
            --directory "$RUNNER_TEMP" \
            gitleaks
          test "$("$RUNNER_TEMP/gitleaks" version)" = "$GITLEAKS_VERSION"
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"

      - name: Scan checked-out working tree
        id: gitleaks-tree
        continue-on-error: true
        run: >-
          "$GITLEAKS_BIN" dir .
          --config .gitleaks.toml
          --redact
          --no-banner

      - name: Scan event commit range
        id: gitleaks-event
        continue-on-error: true
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan every reachable ref and full history
        id: gitleaks-history
        continue-on-error: true
        run: >-
          "$GITLEAKS_BIN" git .
          --config .gitleaks.toml
          --redact
          --log-opts="--all"
          --no-banner

      - name: Enforce every secret-scan seam
        if: always()
        env:
          EVENT_SCAN: ${{ steps.gitleaks-event.outcome }}
          HISTORY_SCAN: ${{ steps.gitleaks-history.outcome }}
          TREE_SCAN: ${{ steps.gitleaks-tree.outcome }}
        run: |
          test "$TREE_SCAN" = "success"
          test "$EVENT_SCAN" = "success"
          test "$HISTORY_SCAN" = "success"

  codeql:
    name: CodeQL security analysis
    permissions:
      contents: read
      security-events: write # Upload reusable CodeQL results to code scanning.
    uses: ./.github/workflows/codeql.yml

  gate:
    name: Required checks passed
    if: always()
    needs: [backend, frontend, container-smoke, secret-scan, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required checks
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          CONTAINER_RESULT: ${{ needs.container-smoke.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
        run: |
          test "$BACKEND_RESULT" = "success"
          test "$CODEQL_RESULT" = "success"
          test "$CONTAINER_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$SECRET_SCAN_RESULT" = "success"

  deploy-production:
    name: Deploy tested main revision
    needs: gate
    # The legacy Railway workflow deploys only the web service while worker,
    # beat, migrations, and filesystem-backed records are not revision-atomic.
    # Undefined repository variables evaluate false, so release stays dark
    # until the split-service topology is explicitly re-approved.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.RAILWAY_PRODUCTION_DEPLOYMENT_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      tested_sha: ${{ github.sha }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        env:
          FLASK_DEBUG: "true"
          SECRET_KEY: "ci-secret-key-for-testing-only"
        run: uv run pytest -q

      # Ad-hoc install so we don't add pip-audit to the dev dependency group.
      # This also pulls the vulnerability database, so it must run after sync.
      - name: Audit Python dependencies (pip-audit)
        continue-on-error: true
        run: |
          uv pip install pip-audit
          uv run pip-audit --strict --desc

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test

      # Advisory: surfaces transitive vulns from package-lock.json.
      # continue-on-error keeps CI green on known/accepted vulns.
      - name: Audit frontend dependencies (npm audit)
        continue-on-error: true
        run: npm audit --audit-level=moderate

  # Advisory secret scanning — runs gitleaks over the whole checkout.
  # continue-on-error so historical findings don't block the pipeline.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
